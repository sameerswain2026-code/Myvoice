name: Android CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Test & build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee ci-unit-tests.log

      - name: Assemble debug + release APKs
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug assembleRelease 2>&1 | tee ci-assemble.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            ci-unit-tests.log
            ci-assemble.log
          if-no-files-found: ignore

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyVoice-APKs
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Job summary
        run: |
          echo "## ✅ Myvoice build finished" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the installable APK from the **Artifacts** section of this run" >> $GITHUB_STEP_SUMMARY
          echo "(unzip \`MyVoice-APKs.zip\` and sideload \`app-debug.apk\` or \`app-release.apk\`)." >> $GITHUB_STEP_SUMMARY

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "MyVoice-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MyVoice-*.apk
          generate_release_notes: true
